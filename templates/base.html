{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}{{ name }} - Portfolio{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block meta %}
    {% endblock %}
</head>

<body>

    <header class="site-header">
        <div class="container header-inner">

            <a href="{% url 'main:show_main' %}" class="brand">
                {{ name }}
            </a>

            <nav aria-label="Main navigation">
                <a href="{% url 'main:show_main' %}">Profile</a>
                <a href="{% url 'main:show_experience' %}">Experience</a>
                <a href="{% url 'main:show_projects' %}">Projects</a>
            </nav>

            <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
                <span class="theme-toggle__icon">&#127769;</span>
            </button>

        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>
                &copy; 2026 {{ name }}.
                Fakultas Ilmu Komputer, Universitas Indonesia.
            </p>
        </div>
    </footer>

    <script src="{% static 'js/theme.js' %}"></script>
    <script src="{% static 'js/project-interactions.js' %}"></script>

</body>
</html>
