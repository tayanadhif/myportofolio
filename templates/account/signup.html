{% extends "base.html" %}

{% block meta %}
    <title>Sign Up - {{ name }}</title>
{% endblock meta %}

{% block content %}
<main>
    <section class="experience-section">
        <div class="container">
            <div class="auth-card">
                <p class="section-kicker">Join the Community</p>

                <h1>Sign Up</h1>

                <p>
                    Create an account to join the community.
                </p>

                <form method="post">
                    {% csrf_token %}

                    {{ form.as_p }}

                    <button type="submit" class="button">
                        Sign Up
                    </button>
                </form>

                <p class="auth-link">
                    Already have an account?
                    <a href="{% url 'account_login' %}">
                        Sign In
                    </a>
                </p>
            </div>
        </div>
    </section>
</main>
{% endblock content %}
